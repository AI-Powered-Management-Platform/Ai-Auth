name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  guard:
    name: schema guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: RiskAssessment must never authorise
        run: python3 scripts/check_risk_schema.py

  proto:
    name: proto lint + breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: generated code is current (drift gate)
        run: |
          buf generate
          git diff --exit-code -- gateway/gen || {
            echo "::error::generated code drifted from the contract — run 'buf generate' and commit"; exit 1; }
      - name: buf breaking (against merge base)
        if: github.event_name == 'pull_request'
        run: |
          if git ls-tree -r "origin/${{ github.base_ref }}" --name-only | grep -q '^proto/.*\.proto$'; then
            buf breaking --against ".git#ref=origin/${{ github.base_ref }}"
          else
            echo "base branch has no proto files yet — skipping breaking check"
          fi

  gateway:
    name: gateway (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: vet, build, test
        working-directory: gateway
        run: |
          go vet ./...
          go build ./...
          go test -race ./...

  crypto:
    name: crypto (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: clippy + test
        working-directory: crypto
        run: |
          rustup component add clippy 2>/dev/null || true
          cargo clippy --locked -- -D warnings
          cargo test --locked

  deploy:
    name: compose + scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: compose file validates
        run: docker compose -f deploy/compose.yaml config -q
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: database isolation controls hold
        run: ./scripts/test-db-isolation.sh
