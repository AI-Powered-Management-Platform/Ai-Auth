// The Thinker's serving contract. Input: signals. Output: RiskAssessment —
// and the schema guard holds over this whole package: nothing here may ever
// carry authority (docs/threat-model.md T8).

syntax = "proto3";

package aiauth.risk.v1;

import "aiauth/risk/v1/risk.proto";

service RiskService {
  // Called only for attempts that already passed cryptographic verification —
  // authenticate before you compute. 50 ms budget; on timeout the gateway
  // assumes BAND_HIGH (fail closed).
  rpc Score(ScoreRequest) returns (RiskAssessment);
}

message ScoreRequest {
  string tenant_id = 1;
  string subject_id = 2;
  string request_id = 3;

  // Signals, all optional, all treated as data — never instructions (T13).
  string client_ip = 4;
  string user_agent = 5;
  string device_fingerprint = 6;
  uint64 attempted_at_unix_ms = 7;
  // Coarse geo derived at the edge, e.g. "KH", "DE". Empty if unknown.
  string country_code = 8;
}
